services:
  # PostgreSQL 16 Database Service
  postgres:
    image: postgres:16-alpine
    container_name: kabhyan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kabhyan_erp}
      POSTGRES_USER: ${DB_USERNAME:-kabhyan_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Kabhyan@2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kabhyan_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kabhyan_user} -d ${DB_DATABASE:-kabhyan_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: kabhyan_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis_data:/data
    networks:
      - kabhyan_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel 13 Backend API (PHP 8.3-FPM + Nginx + Supervisor)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kabhyan_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-KabhyanERP}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:XQ0XmYmGZlE8wB2c3d4E5f6G7h8I9j0K1l2M3n4O5p8=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${BACKEND_URL:-http://localhost:8000}"
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-kabhyan_erp}"
      DB_USERNAME: "${DB_USERNAME:-kabhyan_erp_user}"
      DB_PASSWORD: "${DB_PASSWORD:-Kabhyan@2026}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_CLIENT: "${REDIS_CLIENT:-predis}"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEEDERS: "${RUN_SEEDERS:-true}"
    volumes:
      - backend_storage:/var/www/html/storage
    expose:
      - "80"
    networks:
      - kabhyan_network
      - dokploy-network

  # Next.js 16 Frontend Web Application (Standalone Node.js Runtime)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-/api/v1}"
    container_name: kabhyan_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_BACKEND_URL: "http://backend:80"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-/api/v1}"
    expose:
      - "3000"
    networks:
      - kabhyan_network
      - dokploy-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local

networks:
  kabhyan_network:
    driver: bridge
  dokploy-network:
    external: true

